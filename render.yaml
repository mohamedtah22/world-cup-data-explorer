databases:
  - name: world-cup-postgres
    plan: free
    databaseName: worldcup
    user: worldcup
    postgresMajorVersion: "16"

services:
  - type: web
    name: world-cup-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup-postgres
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://world-cup-frontend.onrender.com

  - type: web
    name: world-cup-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://world-cup-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
